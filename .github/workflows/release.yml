name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Tag must match the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  # Publishing uses PyPI trusted publishing (no token). One-time owner setup on pypi.org:
  # project qtiming -> Publishing -> add GitHub publisher (owner PratulDeshpande, repo QTiming,
  # workflow release.yml, environment pypi), and create the `pypi` environment in the repo.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      # Pinned to a commit: this job holds id-token: write. v1.14.3 == release/v1 at pin time;
      # Dependabot (.github/dependabot.yml) proposes updates.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
