[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata needs >=1.27
build-backend = "hatchling.build"

[project]
name = "qtiming"
version = "0.1.0"
description = "A static timing checker for dynamic quantum circuits"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Pratul Deshpande" }]
maintainers = [{ name = "Pratul Deshpande" }]
requires-python = ">=3.10"
keywords = ["quantum", "dynamic circuits", "timing", "static analysis", "verification", "OpenQASM 3", "Qiskit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# tomli: contract/loader.py falls back to it on Python 3.10 (no tomllib).
dependencies = ["pydantic>=2.5", "tomli>=2; python_version<'3.11'"]

[project.urls]
Homepage = "https://github.com/PratulDeshpande/QTiming"
Source = "https://github.com/PratulDeshpande/QTiming"
Issues = "https://github.com/PratulDeshpande/QTiming/issues"
Changelog = "https://github.com/PratulDeshpande/QTiming/blob/HEAD/CHANGELOG.md"

[project.optional-dependencies]
qiskit = ["qiskit>=2.3,<2.7", "openqasm3[parser]>=1.0,<2", "qiskit-qasm3-import>=0.5"]
z3 = ["z3-solver>=4.13"]
synth = []  # no optional import is used by solve/synth today; the extra is kept for the documented name
bench = ["pyarrow", "matplotlib"]
docs = ["mkdocs>=1.6,<2"]
dev = ["pytest", "pytest-cov", "pytest-xdist", "hypothesis", "ruff", "mypy", "import-linter", "jsonschema"]

[project.scripts]
qtiming = "qtiming.cli.main:main"
qtiming-bench = "qtiming.bench:main"

[project.entry-points."qiskit.transpiler.scheduling"]
qtiming = "qtiming.qiskit_pass.plugin:QtimingSchedulingPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/qtiming"]
# TOML, JSON and py.typed under src/ are packaged by `packages`; listed so tests/release can pin them.
include = [
    "src/qtiming/**/*.py",
    "src/qtiming/py.typed",
    "src/qtiming/contract/instances/*.toml",
    "src/qtiming/contract/instances/*.json",
]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "Docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "CONTRIBUTING.md", "CITATION.cff", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/qtiming/core"]
