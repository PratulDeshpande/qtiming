site_name: qtiming
site_description: Static timing checker for dynamic quantum circuits. Four verdicts, with counterexamples replayed in an independent executor.
site_url: https://pratuldeshpande.github.io/qtiming/
repo_url: https://github.com/PratulDeshpande/QTiming
site_author: Pratul Deshpande
copyright: Copyright 2026 Pratul Deshpande
edit_uri: ""
docs_dir: Docs
exclude_docs: |
  Timed semantics for dynamic quantum programs.md
  Timing rulebook for quantum computers.md
  _pages.txt
theme:
  name: null
  custom_dir: docs-theme
  static_templates:
    - 404.html
extra:
  version: "0.1.0"
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - footnotes
  - attr_list
  - toc:
      permalink: "#"
nav:
  - Start:
      - Overview: index.md
      - Install: install.md
      - Quickstart: quickstart.md
  - Use:
      - Reading a verdict: verdicts.md
      - Obligations: obligations.md
      - Contracts: contracts.md
      - Policies and annotations: policies.md
      - Qiskit passes: qiskit.md
      - Errors: errors.md
      - Command reference: cli.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Why timing breaks dynamic circuits: tutorials/00-why-timing.md
      - Your first verdict: tutorials/01-first-verdict.md
      - The four verdicts: tutorials/02-four-verdicts.md
      - Policies and annotations: tutorials/03-policies.md
      - Obligation tour: tutorials/04-obligations.md
      - Contracts are claims: tutorials/05-contracts.md
      - Same circuit, four stacks: tutorials/06-four-stacks.md
      - Counterexamples you can trust: tutorials/07-counterexamples.md
      - Automatic repair: tutorials/08-repair.md
      - From Qiskit: tutorials/09-qiskit.md
      - qtiming in CI: tutorials/10-ci.md
      - Under the hood: tutorials/11-under-the-hood.md
      - Real workloads: tutorials/12-workloads.md
      - Evidence from hardware jobs: tutorials/13-evidence.md
      - Interactive comparison: tutorials/compare.md
  - Reference:
      - Personalities:
          - IBM: personality-spec/ibm.md
          - Q1: personality-spec/q1.md
          - ARTIQ: personality-spec/artiq.md
          - QUA: personality-spec/qua.md
      - Theory:
          - Overview: theory/index.md
          - Definitions: theory/definitions.md
          - Theorems: theory/theorems.md
          - SC derivation: theory/sc-derivation.md
          - Windowing (T4): theory/T4-windowing.md
          - DC rules (unverified): theory/dc-rules.md
  - Project:
      - Status and limits: status.md
